services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: nowelle_dev
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d nowelle_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
